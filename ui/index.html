<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Humanizer</title>
<style>
  :root {
    --bg: #f6f6f3; --panel: #ffffff; --ink: #1d1f22; --muted: #6b7078; --line: #dcdcd6;
    --accent: #3b5bdb; --ins-bg: #d9f2d0; --ins-ink: #1f5f12; --del-ink: #a33a3a; --warn: #9a6200; --warn-bg: #fff4dc;
    --gi: #d9480f; --sp: #7048e8; --fix-bg: #dbe8ff; --fix-ink: #1c4f9c; --redo-bg: #fff1c2; --redo-line: #d9a400;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141518; --panel: #1c1e22; --ink: #e6e6e3; --muted: #959aa3; --line: #30333a;
      --accent: #7c95ff; --ins-bg: #23401c; --ins-ink: #b9eaa6; --del-ink: #f08e8e; --warn: #f0c060; --warn-bg: #3a2f17;
      --gi: #ff8a50; --sp: #b197fc; --fix-bg: #1f3354; --fix-ink: #a9cbff; --redo-bg: #3b3214; --redo-line: #c9a227;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
         display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0 12px 0 0; font-weight: 650; }
  button, label.btn { font: inherit; font-size: 14px; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--line);
                      background: var(--panel); color: var(--ink); cursor: pointer; }
  button:hover, label.btn:hover { border-color: var(--muted); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button:disabled { opacity: .5; cursor: default; }
  .spacer { flex: 1; }
  .toggle { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--muted); }
  main { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 12px 16px; min-height: 0; }
  .pane { display: flex; flex-direction: column; min-height: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
  .pane .head { display: flex; justify-content: space-between; padding: 8px 14px; border-bottom: 1px solid var(--line);
                font-size: 13px; color: var(--muted); }
  .pane .head b { color: var(--ink); font-weight: 600; }
  #draft, #out, #edit { flex: 1; overflow: auto; padding: 14px; margin: 0; font: 16px/1.65 Georgia, "Iowan Old Style", serif; color: var(--ink); }
  #draft, #edit { border: 0; resize: none; background: transparent; outline: none; }
  #out { white-space: pre-wrap; word-wrap: break-word; }
  #out:empty::before { content: "The rewrite appears here."; color: var(--muted); }
  #out.pending { color: var(--muted); }
  ins { background: var(--ins-bg); color: var(--ins-ink); text-decoration: none; border-radius: 2px; }
  del { color: var(--del-ink); opacity: .75; }
  #out.clean del { display: none; }
  #out.clean ins { background: none; color: inherit; }
  .gfix { background: var(--fix-bg); color: var(--fix-ink); border-bottom: 2px solid var(--fix-ink); border-radius: 2px; cursor: pointer; }
  del.gfix { text-decoration: line-through; opacity: .8; }
  #out.clean .gfix { background: none; color: inherit; border: 0; }
  #out.clean del.gfix { display: none; }
  .redo { background: var(--redo-bg); box-shadow: 0 0 0 1px var(--redo-line); border-radius: 3px;
          -webkit-box-decoration-break: clone; box-decoration-break: clone; cursor: pointer; }
  #out.clean .redo { background: none; box-shadow: none; }
  #out [data-s] { cursor: pointer; }
  .legend { display: inline-flex; gap: 10px; margin-right: 12px; }
  .legend span { padding: 0 4px; border-radius: 2px; }
  .legend .lg-ins { background: var(--ins-bg); color: var(--ins-ink); }
  .legend .lg-gi { text-decoration: underline wavy var(--gi); text-underline-offset: 3px; }
  #flags { margin: 0; padding: 8px 14px; border-top: 1px solid var(--line); font-size: 13px; background: var(--warn-bg);
           color: var(--warn); max-height: 25%; overflow: auto; }
  #flags:empty, #fixed:empty { display: none; }
  .head button.small { padding: 1px 8px; font-size: 12px; margin-left: 10px; }
  #fixed { padding: 8px 14px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); max-height: 20%; overflow: auto; }
  mark.gi { background: none; color: inherit; cursor: pointer; text-decoration: underline wavy var(--gi); text-underline-offset: 3px; }
  mark.gi.sp { --gi: var(--sp); }
  .gcount { color: var(--gi); font-weight: 600; }
  #pop { position: fixed; z-index: 10; max-width: 340px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
         padding: 10px 12px; box-shadow: 0 6px 24px rgba(0,0,0,.18); font-size: 14px; }
  #pop[hidden] { display: none; }
  #preps { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  #preps button { padding: 3px 9px; font-weight: 600; }
  #preps button.ghost { font-weight: 400; color: var(--muted); }
  #flags div + div { margin-top: 4px; }
  footer { display: flex; gap: 16px; padding: 6px 16px 10px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); margin-right: 6px; }
  .dot.up { background: #3aa655; } .dot.down { background: #d04545; }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; grid-auto-rows: minmax(260px, 1fr); } }
</style>
</head>
<body>
<header>
  <h1>Humanizer</h1>
  <button id="go" class="primary" title="Ctrl+Enter">Rewrite</button>
  <button id="stop" disabled>Stop</button>
  <label class="btn">Import file<input id="file" type="file" accept=".txt,.md,.markdown,.docx" hidden></label>
  <span class="spacer"></span>
  <label class="toggle" title="Apply the safe grammar fixes as soon as a rewrite finishes"><input id="auto" type="checkbox"> Auto-correct</label>
  <button id="check" title="Underline grammar issues in the rewrite">Check grammar</button>
  <button id="fixall" title="Apply the safe grammar fixes (shown in blue; click one to undo)">Fix grammar</button>
  <label class="toggle"><input id="marks" type="checkbox" checked> Show changes</label>
  <label class="toggle"><input id="sync" type="checkbox" checked> Sync scroll</label>
  <button id="copy">Copy rewrite</button>
  <button id="save">Download</button>
</header>
<main>
  <section class="pane">
    <div class="head"><b>Draft</b><span id="din">0 words</span></div>
    <textarea id="draft" spellcheck="false" placeholder="Paste a draft here, or import a .txt, .md or .docx file."></textarea>
  </section>
  <section class="pane">
    <div class="head"><b>Rewrite</b><span><span class="legend"><span class="lg-ins">rewording</span><span class="gfix">grammar fix</span><span class="lg-gi">suggestion</span><span class="redo">redone</span></span><span id="gcount" class="gcount"></span> <span id="dout">0 words</span><button id="editbtn" class="small" title="Edit the rewrite as plain text (works with the Grammarly browser extension)">Edit</button></span></div>
    <div id="out"></div>
    <textarea id="edit" spellcheck="true" hidden></textarea>
    <div id="fixed"></div>
    <div id="flags"></div>
  </section>
</main>
<div id="pop" hidden><div id="pmsg"></div><div id="preps"></div></div>
<footer>
  <span><span id="dot" class="dot"></span><span id="srv">checking model server…</span></span>
  <span><span id="ltdot" class="dot"></span><span id="ltsrv">checking LanguageTool…</span></span>
  <span id="status"></span>
</footer>
<script>
const $ = id => document.getElementById(id);
const draft = $('draft'), out = $('out');
let rewrite = '', ctrl = null, t0 = 0, timer = null;

const words = s => (s.match(/\S+/g) || []).length;
const esc = s => s.replace(/[&<>]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;'}[c]));
const norm = w => w.toLowerCase().replace(/[^\p{L}\p{N}]/gu, '') || w;

try { draft.value = localStorage.getItem('hz-draft') || ''; } catch (e) {}
draft.addEventListener('input', () => {
  $('din').textContent = words(draft.value) + ' words';
  try { localStorage.setItem('hz-draft', draft.value); } catch (e) {}
});
$('din').textContent = words(draft.value) + ' words';

// Word-level diff of the rewrite against the draft: which characters of the rewrite are new, and
// which dropped draft words go before which rewrite position.
function diffMarks(a, b) {
  const insAt = new Uint8Array(b.length), dels = new Map();
  const A = a.match(/\S+/g) || [];
  const toks = [...b.matchAll(/\s*(\S+)/g)];
  const B = toks.map(t => t[1]);
  const n = A.length, m = B.length;
  if (!n || !m || n * m > 4e7) return {insAt, dels};
  const na = A.map(norm), nb = B.map(norm);
  // LCS lengths, suffix form, rolled into a direction table to walk forwards
  const dir = new Uint8Array((n + 1) * (m + 1));
  let next = new Int32Array(m + 1), cur = new Int32Array(m + 1);
  for (let i = n - 1; i >= 0; i--) {
    for (let j = m - 1; j >= 0; j--) {
      if (na[i] === nb[j]) { cur[j] = next[j + 1] + 1; dir[i * (m + 1) + j] = 0; }
      else if (next[j] >= cur[j + 1]) { cur[j] = next[j]; dir[i * (m + 1) + j] = 1; }
      else { cur[j] = cur[j + 1]; dir[i * (m + 1) + j] = 2; }
    }
    [next, cur] = [cur, next];
  }
  let i = 0, j = 0, pend = [], prevIns = false;
  const putDel = p => { if (pend.length) { dels.set(p, pend.join(' ')); pend = []; } };
  while (j < m) {
    const d = i < n ? dir[i * (m + 1) + j] : 2;
    if (d === 1) { pend.push(A[i++]); prevIns = false; continue; }
    const t = toks[j], word = t.index + t[0].length - t[1].length;
    putDel(t.index);
    if (d === 0) { i++; prevIns = false; }
    else { insAt.fill(1, prevIns ? t.index : word, t.index + t[0].length); prevIns = true; }
    j++;
  }
  while (i < n) pend.push(A[i++]);
  putDel(b.length);
  return {insAt, dels};
}

const fixTitle = f => `${f.from || '(nothing)'} → ${f.to || '(deleted)'}`;

// Rewrite as HTML: model's new words <ins> (green), dropped draft words <del>, grammar corrections
// <span class="gfix"> (blue), open grammar suggestions <mark class="gi"> (wavy underline), sentences
// rewritten again <span class="redo">. Every run of rewrite text sits in <span data-s="offset">.
function renderOut(a, b, list, fx = [], rd = []) {
  const {insAt, dels} = diffMarks(a, b);
  const iss = new Int32Array(b.length).fill(-1), fix = new Int32Array(b.length).fill(-1);
  const red = new Int32Array(b.length).fill(-1);
  list.forEach((x, k) => iss.fill(k, x.offset, x.offset + x.length));
  rd.forEach((r, k) => red.fill(k, r.offset, r.offset + r.length));
  const gone = new Map();   // corrections that deleted text: shown struck through in blue
  fx.forEach((f, k) => f.length ? fix.fill(k, f.offset, f.offset + f.length) : gone.set(f.offset, k));
  let html = '', s = 0;
  const run = e => {
    if (e <= s) return;
    let t = `<span data-s="${s}">${esc(b.slice(s, e))}</span>`;
    if (fix[s] >= 0) t = `<span class="gfix" data-f="${fix[s]}" title="${esc(fixTitle(fx[fix[s]]))}">${t}</span>`;
    else if (insAt[s]) t = '<ins>' + t + '</ins>';
    if (iss[s] >= 0) t = `<mark class="gi${list[iss[s]].category === 'TYPOS' ? ' sp' : ''}" data-i="${iss[s]}">${t}</mark>`;
    if (red[s] >= 0) t = `<span class="redo" data-r="${red[s]}">${t}</span>`;
    html += t; s = e;
  };
  for (let p = 0; p <= b.length; p++) {
    if (dels.has(p)) {   // dropped words go before the next rewrite word, with a space on each side
      run(p);
      html += (p && !/\s/.test(b[p - 1]) ? ' ' : '') + '<del>' + esc(dels.get(p)) + '</del>'
              + (p < b.length && !/\s/.test(b[p]) ? ' ' : '');
    }
    if (gone.has(p)) {
      run(p);
      const k = gone.get(p);
      html += `<del class="gfix" data-f="${k}" title="${esc(fixTitle(fx[k]))}">${esc(fx[k].from)}</del>`;
    }
    if (p === b.length) run(p);
    else if (p > s && (insAt[p] !== insAt[s] || iss[p] !== iss[s] || fix[p] !== fix[s] || red[p] !== red[s])) run(p);
  }
  return html;
}

function show(text, pending) {
  rewrite = text;
  out.innerHTML = renderOut(draft.value, text, issues, fixes, redos);
  out.classList.toggle('pending', !!pending);
  $('dout').textContent = words(text) + ' words';
  $('gcount').textContent = issues.length ? `${issues.length} to review` : '';
}

// ── grammar (LanguageTool) ─────────────────────────────────────────────────────────────────
let issues = [], fixes = [];
let redos = [];             // {offset, length, prev}: sentences rewritten again; prev is the text before the first redo
const ignored = new Set();  // "rule|text" of undone corrections and ignored suggestions: never applied again
const keyOf = x => x.rule + '|' + rewrite.slice(x.offset, x.offset + x.length);

// Replace rewrite[o, o + n) with rep; issues and corrections inside it are dropped, later ones shift.
// A redone sentence that contains the edit grows or shrinks with it.
function edit(o, n, rep) {
  const d = rep.length - n, end = o + n;
  rewrite = rewrite.slice(0, o) + rep + rewrite.slice(end);
  const keep = y => y.offset >= end || y.offset + y.length <= o;
  const shift = y => y.offset >= end ? {...y, offset: y.offset + d} : y;
  issues = issues.filter(keep).map(shift);
  fixes = fixes.filter(keep).map(shift);
  redos = redos.flatMap(r => {
    if (end <= r.offset) return [{...r, offset: r.offset + d}];
    if (o >= r.offset + r.length) return [r];
    if (o >= r.offset && end <= r.offset + r.length) return [{...r, length: r.length + d}];
    return [];
  });
}

function applyFix(k, rep) {
  const x = issues[k], from = rewrite.slice(x.offset, x.offset + x.length);
  edit(x.offset, x.length, rep);
  fixes.push({offset: x.offset, length: rep.length, from, to: rep, message: x.message, rule: x.rule});
  fixes.sort((p, q) => p.offset - q.offset);
}

function undoFix(k) {
  const f = fixes[k];
  ignored.add(f.rule + '|' + f.from);
  fixes.splice(k, 1);
  edit(f.offset, f.length, f.from);
}

// ── rewrite selected sentences again ─────────────────────────────────────────────────────────
function sentenceAt(o) {
  const t = rewrite, endP = /[.!?。！？]/;
  let s = Math.min(o, t.length), e = s;
  while (s > 0 && t[s - 1] !== '\n' && !(/\s/.test(t[s - 1]) && s > 1 && endP.test(t[s - 2]))) s--;
  while (e < t.length && t[e] !== '\n' && !(endP.test(t[e]) && (e + 1 === t.length || /\s/.test(t[e + 1])))) e++;
  if (e < t.length && t[e] !== '\n') e++;   // keep the closing punctuation
  while (s < e && /\s/.test(t[s])) s++;
  while (e > s && /\s/.test(t[e - 1])) e--;
  return [s, e];
}

// DOM position (text node + offset) → offset in rewrite, via the data-s runs.
function posOf(node, off) {
  if (node.nodeType !== 3) {
    const c = node.childNodes[off] || node.childNodes[off - 1];
    const el = c && (c.nodeType === 3 ? c.parentElement : (c.matches('[data-s]') ? c : c.querySelector('[data-s]')));
    const run = el && el.closest('[data-s]');
    return run ? +run.dataset.s : null;
  }
  const run = node.parentElement.closest('[data-s]');
  return run ? +run.dataset.s + off : null;
}

async function redoRange(s, e) {
  pop.hidden = true;
  // take whole redone sentences, and send the text from before they were redone
  for (const r of redos) if (r.offset < e && r.offset + r.length > s) { s = Math.min(s, r.offset); e = Math.max(e, r.offset + r.length); }
  let prev = '', p = s;
  for (const r of redos.filter(r => r.offset >= s && r.offset + r.length <= e).sort((x, y) => x.offset - y.offset)) {
    prev += rewrite.slice(p, r.offset) + r.prev; p = r.offset + r.length;
  }
  prev += rewrite.slice(p, e);
  $('go').disabled = true; setStatus('Rewriting again…');
  try {
    const r = await fetch('/api/redo', {method: 'POST', headers: {'Content-Type': 'application/json'},
                                        body: JSON.stringify({text: prev})});
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || r.statusText);
    if (!d.pieces) { setStatus('Too short for the model to rewrite (under about 6 words); select more text.'); return; }
    let text = d.text.trim();
    if (!/\n/.test(prev)) text = text.replace(/\s*\n+\s*/g, ' ');   // one sentence in, one paragraph out
    redos = redos.filter(x => x.offset + x.length <= s || x.offset >= e);
    edit(s, e - s, text);
    redos.push({offset: s, length: text.length, prev});
    redos.sort((x, y) => x.offset - y.offset);
    const list = await checkGrammar(rewrite);
    if (list) await autoCorrect(list, [s, s + text.length]);
    show(rewrite); showFixed();
    setStatus('Rewritten again' + (d.flags.length ? ' · check it: ' + d.flags.map(f => f.note).join('; ') : '')
              + ' · click it to revert or try again');
  } catch (err) {
    setStatus('Error: ' + err.message);
  } finally {
    $('go').disabled = false;
  }
}

function revertRedo(k) {
  const r = redos[k];
  redos.splice(k, 1);
  edit(r.offset, r.length, r.prev);
}

async function checkGrammar(text) {
  const r = await fetch('/api/check', {method: 'POST', headers: {'Content-Type': 'application/json'},
                                       body: JSON.stringify({text, draft: draft.value})});
  const d = await r.json();
  return d.available ? d.issues : null;
}

// Apply the safe fixes (grammar, punctuation, casing), check again, up to three rounds. With a range
// [start, end), only issues inside it are taken from the check; the rest stay as they were.
async function autoCorrect(list, range = null, force = false) {
  const within = x => !range || (x.offset >= range[0] && x.offset + x.length <= range[1]);
  for (let round = 0; ; round++) {
    issues = [...(range ? issues.filter(x => !within(x)) : []),
              ...list.filter(x => within(x) && !ignored.has(keyOf(x)))].sort((p, q) => p.offset - q.offset);
    const auto = issues.filter(x => x.auto && within(x)).sort((p, q) => q.offset - p.offset);
    if (round === 3 || !auto.length || !(force || $('auto').checked)) return;
    let lastStart = Infinity;
    for (const x of auto) {   // from the end, so earlier offsets stay valid
      const k = issues.indexOf(x);
      if (k < 0 || x.offset + x.length > lastStart) continue;
      if (range) range[1] += x.replacements[0].length - x.length;
      applyFix(k, x.replacements[0]);
      lastStart = x.offset;
    }
    list = await checkGrammar(rewrite);
    if (!list) return;
  }
}

function showFixed() {
  $('fixed').innerHTML = fixes.length
    ? `<span class="gfix">${fixes.length} grammar correction${fixes.length > 1 ? 's' : ''}</span> in blue:`
      + ' hover to see what changed, click to undo.' : '';
}

async function runCheck() {
  if (!rewrite) return;
  setStatus('Checking grammar…');
  const list = await checkGrammar(rewrite);
  if (!list) { setStatus('LanguageTool is not running; start it with ./start-languagetool.sh'); return; }
  await autoCorrect(list);
  show(rewrite); showFixed();
  setStatus(`Grammar: ${fixes.length} corrected, ${issues.length} to review`);
}

async function fixAll() {
  if (!rewrite || editing) return;
  setStatus('Fixing grammar…');
  const list = await checkGrammar(rewrite);
  if (!list) { setStatus('LanguageTool is not running; start it with ./start-languagetool.sh'); return; }
  const before = fixes.length;
  await autoCorrect(list, null, true);
  show(rewrite); showFixed();
  setStatus(`Grammar: ${fixes.length - before} fixed (blue, click one to undo), ${issues.length} suggestion(s) left`);
}

// ── edit the rewrite as plain text (the Grammarly browser extension works in text boxes) ──────
const editBox = $('edit');
let editing = false;
const current = () => editing ? editBox.value : rewrite;
function setEditing(on) {
  if (on === editing || (on && !rewrite)) return;
  let changed = false;
  if (on) { editBox.value = rewrite; pop.hidden = true; }
  else if (editBox.value !== rewrite) {
    // marks and offsets belong to the old text: start fresh from the edited one
    rewrite = editBox.value; issues = []; fixes = []; redos = []; changed = true;
  }
  editing = on;
  out.hidden = on; editBox.hidden = !on;
  $('editbtn').textContent = on ? 'Done editing' : 'Edit';
  $('editbtn').classList.toggle('primary', on);
  $('check').disabled = $('fixall').disabled = on;
  if (on) { editBox.focus(); setStatus('Editing: Grammarly and the browser spell check work here. Click Done editing to go back.'); }
  else {
    show(rewrite); showFixed();
    if (changed) setStatus('Edits kept. Change marks now compare with the draft; click Check grammar to check again.');
  }
}
$('editbtn').onclick = () => setEditing(!editing);
editBox.addEventListener('input', () => $('dout').textContent = words(editBox.value) + ' words');

const pop = $('pop');
function openPop(el) {
  const r = el.getBoundingClientRect();
  pop.hidden = false;
  pop.style.left = Math.max(8, Math.min(r.left, innerWidth - pop.offsetWidth - 8)) + 'px';
  pop.style.top = (r.bottom + 6 + pop.offsetHeight > innerHeight ? r.top - pop.offsetHeight - 6 : r.bottom + 6) + 'px';
}
out.addEventListener('click', e => {
  const fx = e.target.closest('.gfix');
  if (fx && !e.target.closest('mark.gi')) {   // a correction: show what changed, offer undo
    const k = +fx.dataset.f, f = fixes[k];
    $('pmsg').innerHTML = `<b>${esc(fixTitle(f))}</b><br>${esc(f.message)}`;
    $('preps').innerHTML = '';
    const b = document.createElement('button');
    b.textContent = 'Undo';
    b.onclick = () => { undoFix(k); pop.hidden = true; show(rewrite); showFixed(); };
    $('preps').append(b);
    openPop(fx);
    e.stopPropagation();
    return;
  }
  const mk = e.target.closest('mark.gi');
  if (!mk) { sentenceMenu(e); return; }
  const k = +mk.dataset.i, x = issues[k];
  $('pmsg').textContent = x.message;
  $('preps').innerHTML = '';
  for (const rep of x.replacements) {
    const b = document.createElement('button');
    b.textContent = rep === '' ? '(delete)' : rep;
    b.onclick = () => { applyFix(k, rep); pop.hidden = true; show(rewrite); showFixed(); };
    $('preps').append(b);
  }
  const ig = document.createElement('button');
  ig.textContent = 'Ignore'; ig.className = 'ghost';
  ig.onclick = () => { ignored.add(keyOf(x)); issues.splice(k, 1); pop.hidden = true; show(rewrite); };
  $('preps').append(ig);
  openPop(mk);
  e.stopPropagation();
});

const btn = (label, fn, cls = '') => {
  const b = document.createElement('button');
  b.textContent = label; b.className = cls; b.onclick = fn;
  return b;
};

// Click a sentence (or select several) → rewrite again; click a redone one → revert or try again.
function sentenceMenu(e) {
  if (!rewrite || !$('stop').disabled || $('go').disabled) return;   // not while a rewrite runs
  const sel = getSelection();
  let s = null, en = null;
  if (sel.rangeCount && !sel.isCollapsed && out.contains(sel.anchorNode)) {
    const r = sel.getRangeAt(0);
    const a = posOf(r.startContainer, r.startOffset), b = posOf(r.endContainer, r.endOffset);
    if (a !== null && b !== null && b > a) { s = sentenceAt(a)[0]; en = sentenceAt(Math.max(a, b - 1))[1]; }
  }
  const rd = e.target.closest('.redo');
  if (s === null && rd) {
    const k = +rd.dataset.r, r = redos[k];
    $('pmsg').innerHTML = `<b>Rewritten again.</b> Before: “${esc(r.prev.length > 160 ? r.prev.slice(0, 160) + '…' : r.prev)}”`;
    $('preps').innerHTML = '';
    $('preps').append(btn('Revert', () => { revertRedo(k); pop.hidden = true; show(rewrite); showFixed(); }),
                      btn('Try again', () => redoRange(r.offset, r.offset + r.length), 'ghost'));
    openPop(rd); e.stopPropagation();
    return;
  }
  if (s === null) {
    const p = sel.rangeCount ? posOf(sel.anchorNode, sel.anchorOffset) : null;
    if (p === null) return;
    [s, en] = sentenceAt(p);
  }
  if (en <= s) return;
  const t = rewrite.slice(s, en), n = (t.match(/[.!?。！？](\s|$)/g) || []).length || 1;
  $('pmsg').textContent = `“${t.length > 160 ? t.slice(0, 160) + '…' : t}”`;
  $('preps').innerHTML = '';
  $('preps').append(btn(n > 1 ? `Rewrite these ${n} sentences again` : 'Rewrite this sentence again', () => redoRange(s, en)));
  openPop(e.target.closest('[data-s]') || out); e.stopPropagation();
}
document.addEventListener('click', e => { if (!pop.contains(e.target)) pop.hidden = true; });
document.addEventListener('keydown', e => { if (e.key === 'Escape') pop.hidden = true; });
out.addEventListener('scroll', () => pop.hidden = true);

function setStatus(s) { $('status').textContent = s; }
function busy(on) {
  $('go').disabled = on; $('stop').disabled = !on; draft.readOnly = on; $('editbtn').disabled = on;
  clearInterval(timer);
  if (on) { t0 = Date.now(); timer = setInterval(tick, 500); }
}
let progress = '';
function tick() { setStatus(progress + ' · ' + ((Date.now() - t0) / 1000).toFixed(0) + ' s'); }

async function run() {
  setEditing(false);
  const text = draft.value;
  if (!text.trim()) return;
  ctrl = new AbortController();
  $('flags').innerHTML = ''; $('fixed').innerHTML = '';
  out.textContent = ''; rewrite = ''; issues = []; fixes = []; redos = []; ignored.clear();
  progress = 'starting'; busy(true); tick();
  try {
    const r = await fetch('/api/rewrite', {method: 'POST', body: JSON.stringify({text}), signal: ctrl.signal,
                                           headers: {'Content-Type': 'application/json'}});
    if (!r.ok) throw new Error((await r.json()).error || r.statusText);
    const reader = r.body.getReader(), dec = new TextDecoder();
    let buf = '';
    for (;;) {
      const {value, done} = await reader.read();
      if (done) break;
      buf += dec.decode(value, {stream: true});
      let nl;
      while ((nl = buf.indexOf('\n')) >= 0) { handle(JSON.parse(buf.slice(0, nl))); buf = buf.slice(nl + 1); }
    }
  } catch (e) {
    if (e.name !== 'AbortError') { busy(false); setStatus('Error: ' + e.message); return; }
    setStatus('Stopped. Pieces finished so far are kept.');
  }
  busy(false);
}

function handle(ev) {
  if (ev.type === 'plan') {
    progress = ev.pieces ? `rewriting ${ev.pieces} piece${ev.pieces > 1 ? 's' : ''}` : 'nothing to rewrite';
    show(draft.value, true);
  } else if (ev.type === 'progress') {
    progress = `piece ${ev.k}/${ev.total}`;
  } else if (ev.type === 'piece') {
    show(ev.text, ev.k < ev.total);
  } else if (ev.type === 'checking') {
    progress = 'checking grammar';
  } else if (ev.type === 'done') {
    rewrite = ev.text;
    $('flags').innerHTML = ev.flags.map(f =>
      `<div><b>Line ${f.line}</b> (“${esc(f.start)}…”): ${esc(f.note)}</div>`).join('');
    const finish = () => {
      show(rewrite, false); showFixed(); busy(false);
      setStatus(`Done in ${ev.seconds} s · ${ev.pieces} piece(s) · copies ${(ev.copy_rate * 100).toFixed(0)}% of the draft`
                + (ev.flags.length ? ` · ${ev.flags.length} piece(s) to check` : '')
                + (ev.lt ? (fixes.length ? ` · grammar: ${fixes.length} corrected, ${issues.length} to review`
                                         : ` · grammar: ${issues.length} issue(s) underlined; Fix grammar applies the safe ones`)
                         : ' · grammar check off (LanguageTool not running)'));
    };
    autoCorrect(ev.issues).then(finish, finish);
  } else if (ev.type === 'error') {
    busy(false); setStatus('Error: ' + ev.error);
  }
}

$('go').onclick = run;
$('check').onclick = runCheck;
$('fixall').onclick = fixAll;
try { $('auto').checked = localStorage.getItem('hz-auto') === '1'; } catch (e) {}
$('auto').onchange = e => { try { localStorage.setItem('hz-auto', e.target.checked ? '1' : '0'); } catch (err) {} };
$('stop').onclick = () => ctrl && ctrl.abort();
document.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && !$('go').disabled) run(); });
$('marks').onchange = e => out.classList.toggle('clean', !e.target.checked);

$('copy').onclick = async () => {
  if (!current()) return;
  await navigator.clipboard.writeText(current());
  $('copy').textContent = 'Copied'; setTimeout(() => $('copy').textContent = 'Copy rewrite', 1200);
};
$('save').onclick = () => {
  if (!current()) return;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([current()], {type: 'text/plain'}));
  a.download = 'rewrite.txt'; a.click(); URL.revokeObjectURL(a.href);
};

$('file').onchange = async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  let text;
  if (/\.docx$/i.test(f.name)) {
    const r = await fetch('/api/import', {method: 'POST', body: await f.arrayBuffer()});
    const d = await r.json();
    if (!r.ok) return setStatus(d.error);
    text = d.text;
  } else text = await f.text();
  draft.value = text; draft.dispatchEvent(new Event('input'));
  setStatus('Imported ' + f.name);
};

// proportional scroll sync between the panes
let syncing = false;
function syncFrom(src, dst) {
  if (!$('sync').checked || syncing) return;
  syncing = true;
  const p = src.scrollTop / Math.max(1, src.scrollHeight - src.clientHeight);
  dst.scrollTop = p * (dst.scrollHeight - dst.clientHeight);
  requestAnimationFrame(() => syncing = false);
}
draft.addEventListener('scroll', () => syncFrom(draft, editing ? editBox : out));
editBox.addEventListener('scroll', () => syncFrom(editBox, draft));
out.addEventListener('scroll', () => syncFrom(out, draft));

async function health() {
  try {
    const d = await (await fetch('/api/health')).json();
    $('dot').className = 'dot ' + (d.up ? 'up' : 'down');
    $('srv').textContent = (d.up ? 'model server ready' : 'model server not running') + ' (' + d.server + ')';
    $('ltdot').className = 'dot ' + (d.lt_up ? 'up' : 'down');
    $('ltsrv').textContent = d.lt_up ? 'LanguageTool ready' : 'LanguageTool not running (grammar check off)';
  } catch (e) { $('dot').className = 'dot down'; $('srv').textContent = 'UI server not reachable'; }
}
health(); setInterval(health, 10000);
</script>
</body>
